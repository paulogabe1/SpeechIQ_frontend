<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box}body{margin:0}
.root{--ink:#17161B;--muted:#71707B;--faint:#A6A5B0;--line:#EAEAEF;--line2:#F3F3F7;--brand:#7C3AED;font-family:'Geist','Inter',system-ui,sans-serif;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:44px;background:linear-gradient(160deg,#FAF5FF 0%,#EFF6FF 55%,#F0FDFA 100%)}
.root .lucide{stroke-width:2;display:inline-block}
.fw{width:100%;max-width:360px;margin:0 auto}
.frame{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 40px 90px -34px rgba(30,25,60,.4),0 2px 8px rgba(30,25,60,.06);display:flex;width:980px;height:660px}
.brandside{width:44%;padding:36px 34px;display:flex;flex-direction:column;color:#fff;background:linear-gradient(160deg,#241D42 0%,#312862 58%,#3A2E74 100%);position:relative;overflow:hidden}
.bglow{position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(140,90,255,.5),transparent 70%);top:-90px;right:-110px}
.bs-logo{display:flex;align-items:center;gap:11px;position:relative}
.lg{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,255,255,.16)}
.lg .lucide{width:18px;height:18px;color:#fff}
.bs-word{font-size:17px;font-weight:600;letter-spacing:-0.03em}
.bs-mid{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative}
.bs-tag{font-size:30px;font-weight:600;letter-spacing:-0.03em;line-height:1.18;max-width:320px}
.bs-sub{font-size:13.5px;color:rgba(255,255,255,.72);margin-top:16px;line-height:1.55;max-width:300px}
.shot{margin-top:24px;border-radius:12px;overflow:hidden;background:#fff;width:329px;height:193px;box-shadow:0 22px 44px -16px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14);position:relative}
.shot-scale{width:1400px;height:820px;transform:scale(0.235);transform-origin:top left;pointer-events:none}
.bs-stats{display:flex;gap:24px;position:relative}
.bs-stat .n{font-size:19px;font-weight:600;font-family:'Geist Mono',monospace}
.bs-stat .l{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px;line-height:1.3}
.formside{flex:1;padding:44px 40px;display:flex;flex-direction:column;justify-content:center}
</style>
</helmet>
<div class="root">
<div class="frame">
<div class="brandside">
<div class="bglow"></div>
<div class="bs-logo"><div class="lg"><i data-lucide="audio-lines"></i></div><div class="bs-word">SpeechIQ</div></div>
<div class="bs-mid"><div class="bs-tag">Your voice is powerful. Learn to use it.</div><div class="bs-sub">Record, analyze, and improve with AI feedback across five dimensions of how you speak.</div><div class="shot"><div class="shot-scale"><dc-import name="Dashboard" hint-size="1400px,820px"></dc-import></div></div></div>
<div class="bs-stats"><div class="bs-stat"><div class="n">4.8★</div><div class="l">App rating</div></div><div class="bs-stat"><div class="n">82%</div><div class="l">Avg. improvement</div></div><div class="bs-stat"><div class="n">14k+</div><div class="l">Speakers</div></div></div>
</div>
<div class="formside"><div class="fw"><dc-import name="AuthForm" hint-size="100%,520px"></dc-import></div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1068,&quot;height&quot;:748}}">
class Component extends DCLogic {
  componentDidMount(){ this.icons(); }
  componentDidUpdate(){ this.icons(); }
  icons(){ try{ window.lucide && window.lucide.createIcons(); }catch(e){} }
  renderVals(){ return {}; }
}
</script>
</body>
</html>
