<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box}
.authform{--ink:#17161B;--ink2:#3B3A44;--muted:#71707B;--faint:#A6A5B0;--line:#EAEAEF;--line2:#F3F3F7;--brand:#7C3AED;font-family:'Geist','Inter',system-ui,sans-serif;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;color:var(--ink);width:100%}
.authform .lucide{stroke-width:2;display:inline-block}
.af-head{margin-bottom:24px}
.af-title{font-size:23px;font-weight:600;letter-spacing:-0.03em}
.af-sub{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.5}
.social{display:flex;flex-direction:column;gap:10px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;cursor:pointer;transition:background .13s,border-color .13s}
.sbtn:hover{background:var(--line2);border-color:#DEDDE6}
.sbtn svg{flex-shrink:0}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--faint);font-size:12px;font-weight:500}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.pw-row{display:flex;align-items:center;justify-content:space-between}
.pw-row a{font-size:12px;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:none}
.inp{position:relative;display:flex;align-items:center}
.inp .ic{position:absolute;left:13px;color:var(--faint);width:17px;height:17px;pointer-events:none}
.inp input{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 40px;transition:border-color .13s,box-shadow .13s;letter-spacing:-0.01em}
.inp input::placeholder{color:var(--faint)}
.inp input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,58,237,.13)}
.eye{position:absolute;right:10px;background:none;border:none;padding:6px;cursor:pointer;color:var(--faint);display:flex}
.eye .lucide{width:17px;height:17px}
.remember{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);margin:2px 0 18px;cursor:pointer;user-select:none}
.rbox{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s}
.rbox .lucide{width:12px;height:12px;color:#fff}
.rbox.on{background:var(--brand);border-color:var(--brand)}
.submit{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-family:inherit;font-size:14.5px;font-weight:600;color:#fff;background:var(--ink);border:none;border-radius:11px;padding:13px;cursor:pointer;transition:background .13s}
.submit:hover{background:#000}
.submit .lucide{width:17px;height:17px}
.foot{margin-top:20px;text-align:center;font-size:13.5px;color:var(--muted)}
.foot a{color:var(--brand);font-weight:600;cursor:pointer;text-decoration:none}
.sent{text-align:center;padding:8px 0}
.sent-ic{width:54px;height:54px;border-radius:15px;background:#F3ECFD;color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.sent-ic .lucide{width:26px;height:26px}
.sent-t{font-size:20px;font-weight:600;letter-spacing:-0.02em}
.sent-d{font-size:13.5px;color:var(--muted);margin:8px 0 22px;line-height:1.55}
</style>
</helmet>
<div class="authform">
<sc-if value="{{ forgotSent }}" hint-placeholder-val="{{ false }}">
<div class="sent"><div class="sent-ic"><i data-lucide="mail-check"></i></div><div class="sent-t">Check your inbox</div><div class="sent-d">We've sent a password reset link to your email. It expires in 30 minutes.</div><button class="submit" onClick="{{ goSignin }}">Back to sign in</button></div>
</sc-if>
<sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
<div class="af-head"><div class="af-title">{{ title }}</div><div class="af-sub">{{ subtitle }}</div></div>
<sc-if value="{{ notForgot }}" hint-placeholder-val="{{ true }}">
<div class="social">
<button class="sbtn" onClick="{{ social }}"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M23.52 12.27c0-.79-.07-1.54-.2-2.27H12v4.51h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.87z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.76-2.11-6.7-4.94H1.29v3.09A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.31A7.2 7.2 0 0 1 4.92 12c0-.8.14-1.58.38-2.31V6.6H1.29A12 12 0 0 0 0 12c0 1.94.46 3.77 1.29 5.4z"/><path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.58 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.29 6.6l4.01 3.09C6.24 6.86 8.88 4.75 12 4.75z"/></svg> Continue with Google</button>
<button class="sbtn" onClick="{{ social }}"><svg viewBox="0 0 24 24" width="18" height="18" fill="#17161B"><path d="M17.05 12.53c-.02-2.02 1.65-2.99 1.72-3.04-.94-1.37-2.4-1.56-2.92-1.58-1.24-.13-2.42.73-3.05.73-.63 0-1.6-.71-2.63-.69-1.35.02-2.6.79-3.29 2-1.4 2.43-.36 6.02 1 8 .67.96 1.46 2.04 2.5 2 1-.04 1.38-.65 2.59-.65 1.2 0 1.55.65 2.6.63 1.07-.02 1.75-.98 2.41-1.95.76-1.12 1.07-2.2 1.09-2.26-.02-.01-2.09-.8-2.11-3.17zM15.1 6.36c.55-.67.92-1.6.82-2.53-.79.03-1.75.53-2.32 1.19-.51.59-.96 1.53-.84 2.44.88.07 1.79-.45 2.34-1.1z"/></svg> Continue with Apple</button>
</div>
<div class="divider">or</div>
</sc-if>
<sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}"><div class="field"><label>Full name</label><div class="inp"><i data-lucide="user" class="ic"></i><input type="text" placeholder="Alex Rivera"></div></div></sc-if>
<div class="field"><label>Email</label><div class="inp"><i data-lucide="mail" class="ic"></i><input type="email" placeholder="you@email.com"></div></div>
<sc-if value="{{ notForgot }}" hint-placeholder-val="{{ true }}">
<div class="field"><div class="pw-row"><label>Password</label><sc-if value="{{ isSignin }}" hint-placeholder-val="{{ true }}"><a onClick="{{ goForgot }}">Forgot?</a></sc-if></div><div class="inp"><i data-lucide="lock" class="ic"></i><input type="{{ pwType }}" placeholder="••••••••"><button class="eye" onClick="{{ togglePw }}"><i data-lucide="{{ eyeIcon }}"></i></button></div></div>
</sc-if>
<sc-if value="{{ isSignin }}" hint-placeholder-val="{{ true }}"><div class="remember" onClick="{{ toggleRemember }}"><span class="rbox {{ rememberCls }}"><sc-if value="{{ remember }}" hint-placeholder-val="{{ false }}"><i data-lucide="check"></i></sc-if></span> Keep me signed in</div></sc-if>
<button class="submit" onClick="{{ submit }}">{{ submitLabel }} <i data-lucide="arrow-right"></i></button>
<div class="foot">
<sc-if value="{{ isSignin }}" hint-placeholder-val="{{ true }}">New to SpeechIQ? <a onClick="{{ goSignup }}">Create an account</a></sc-if>
<sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">Already have an account? <a onClick="{{ goSignin }}">Sign in</a></sc-if>
<sc-if value="{{ isForgot }}" hint-placeholder-val="{{ false }}"><a onClick="{{ goSignin }}">← Back to sign in</a></sc-if>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:560}}">
class Component extends DCLogic {
  state = { mode: "signin", showPw: false, remember: false, sent: false };
  componentDidMount(){ this.icons(); }
  componentDidUpdate(){ this.icons(); }
  icons(){ try{ window.lucide && window.lucide.createIcons(); }catch(e){} }
  go(dest){ try{ window.location.href = dest; }catch(e){} }
  renderVals(){
    const { mode, showPw, remember, sent } = this.state;
    const meta = {
      signin: { title:"Welcome back", subtitle:"Sign in to continue your practice.", submitLabel:"Sign in" },
      signup: { title:"Create your account", subtitle:"Start improving your speech today.", submitLabel:"Create account" },
      forgot: { title:"Reset your password", subtitle:"Enter your email and we'll send you a reset link.", submitLabel:"Send reset link" },
    }[mode];
    const forgotSent = mode === "forgot" && sent;
    return {
      ...meta,
      isSignin: mode==="signin", isSignup: mode==="signup", isForgot: mode==="forgot", notForgot: mode!=="forgot",
      forgotSent, showForm: !forgotSent,
      pwType: showPw ? "text" : "password",
      eyeIcon: showPw ? "eye-off" : "eye",
      remember, rememberCls: remember ? "on" : "",
      goSignin: () => this.setState({ mode:"signin", sent:false }),
      goSignup: () => this.setState({ mode:"signup", sent:false }),
      goForgot: () => this.setState({ mode:"forgot", sent:false }),
      togglePw: () => this.setState(s => ({ showPw: !s.showPw })),
      toggleRemember: () => this.setState(s => ({ remember: !s.remember })),
      social: () => this.go("Dashboard.dc.html"),
      submit: () => { if (this.state.mode === "forgot") this.setState({ sent:true }); else this.go("Dashboard.dc.html"); },
    };
  }
}
</script>
</body>
</html>
