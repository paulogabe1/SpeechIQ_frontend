<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box}
.appnav{--ink:#17161B;--ink2:#3B3A44;--muted:#71707B;--faint:#A6A5B0;--line:#EAEAEF;--line2:#F3F3F7;--brand:#7C3AED;--brandsoft:#F3ECFD;font-family:'Geist','Inter',system-ui,sans-serif;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;width:256px;height:100%;min-height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;color:var(--ink)}
.appnav .lucide{display:inline-block;stroke-width:2}
.appnav a{text-decoration:none;color:inherit}
.nbrand{display:flex;align-items:center;gap:11px;padding:24px 22px 18px}
.nlogo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#7C3AED,#2563EB);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -4px rgba(90,50,220,.5)}
.nlogo .lucide{width:19px;height:19px;color:#fff}
.nword{font-size:18px;font-weight:600;letter-spacing:-0.03em}
.nword span{color:var(--brand)}
.nbody{flex:1;padding:6px 14px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.neye{font-size:10.5px;font-weight:600;letter-spacing:0.11em;text-transform:uppercase;color:var(--faint);padding:16px 10px 7px}
.nitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;cursor:pointer;width:100%;color:var(--muted);transition:background .13s,color .13s}
.nitem .lucide{width:18px;height:18px;flex-shrink:0;color:var(--faint);transition:color .13s}
.nitem span{font-size:14px;font-weight:500;letter-spacing:-0.01em}
.nitem:hover{background:var(--line2);color:var(--ink2)}
.nitem:hover .lucide{color:var(--muted)}
.nitem.non{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,20,40,.05),0 0 0 1px var(--line);position:relative}
.nitem.non::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#7C3AED,#2563EB)}
.nitem.non .lucide{color:var(--brand)}
.nitem.non span{font-weight:600}
.ncta{display:flex;align-items:center;gap:11px;margin:4px 0 2px;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#7C3AED,#2563EB);color:#fff;cursor:pointer;width:100%;box-shadow:0 8px 18px -6px rgba(90,50,220,.5);transition:transform .13s,box-shadow .13s}
.ncta:hover{transform:translateY(-1px);box-shadow:0 12px 22px -6px rgba(90,50,220,.55)}
.ncta .lucide{width:18px;height:18px}
.ncta-t{font-size:14px;font-weight:600}
.ncta-k{margin-left:auto;font-size:11px;font-weight:500;color:rgba(255,255,255,.72)}
.nfoot{padding:12px 14px 16px;border-top:1px solid var(--line)}
.nuser{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;cursor:pointer;transition:background .13s}
.nuser:hover{background:var(--line2)}
.nav-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#8B3FF0,#2F6BF0);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0}
.nu-name{font-size:13.5px;font-weight:600;line-height:1.2}
.nu-meta{font-size:11.5px;color:var(--muted);margin-top:1px}
.nu-meta b{color:var(--brand);font-weight:600}
.nchev{margin-left:auto;color:var(--faint)}
.nchev .lucide{width:16px;height:16px}
.nupsell{display:block;margin:10px 4px 4px;padding:15px 16px;border-radius:14px;background:linear-gradient(140deg,#1B1730,#2A2350);color:#fff;position:relative;overflow:hidden}
.nupsell .nglow{position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(140,90,255,.55),transparent 70%)}
.nup-eye{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#C9B6FF;display:flex;align-items:center;gap:6px}
.nup-eye .lucide{width:13px;height:13px}
.nup-t{font-size:14px;font-weight:600;margin:7px 0 3px;letter-spacing:-0.01em}
.nup-d{font-size:11.5px;color:rgba(255,255,255,.7);line-height:1.4}
.nup-btn{margin-top:12px;text-align:center;font-size:12.5px;font-weight:600;color:#1B1730;background:#fff;border-radius:9px;padding:8px}
.nprostat{margin:10px 4px 4px;padding:14px 15px;border-radius:14px;background:linear-gradient(140deg,#FAF8FE,#F1F5FE);border:1px solid #EBE7F8}
.npro-top{display:flex;align-items:center;justify-content:space-between}
.npro-badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--brand)}
.npro-badge .lucide{width:14px;height:14px;color:#EA7317}
.npro-live{font-size:10px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:#15864B;background:#E4F3EA;border-radius:999px;padding:3px 8px}
.npro-d{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:8px}
.npro-renew{font-size:11px;color:var(--faint);font-weight:500;margin-top:10px}
.npro-renew b{color:var(--brand);font-weight:600}
</style>
</helmet>
<nav class="appnav">
<a class="nbrand" href="Dashboard.dc.html"><div class="nlogo"><i data-lucide="audio-lines"></i></div><div class="nword">Speech<span>IQ</span></div></a>
<div class="nbody">
<a class="ncta" href="Practice.dc.html"><i data-lucide="mic"></i><span class="ncta-t">Practice</span><span class="ncta-k">+50 XP</span></a>
<div class="neye">Menu</div>
<sc-for list="{{ menu }}" as="n" hint-placeholder-count="4"><a class="nitem {{ n.cls }}" href="{{ n.href }}"><i data-lucide="{{ n.icon }}"></i><span>{{ n.label }}</span></a></sc-for>
<div class="neye">Account</div>
<a class="nitem {{ profileCls }}" href="Profile.dc.html"><i data-lucide="user"></i><span>Profile</span></a>
<sc-if value="{{ isFree }}" hint-placeholder-val="{{ true }}"><a class="nupsell" href="Voice Lab.dc.html"><div class="nglow"></div><div class="nup-eye"><i data-lucide="sparkles"></i> Voice Lab</div><div class="nup-t">Unlock SpeechIQ Pro</div><div class="nup-d">Clone your voice &amp; get unlimited AI coaching.</div><div class="nup-btn">Upgrade</div></a></sc-if>
<sc-if value="{{ isPro }}" hint-placeholder-val="{{ false }}"><div class="nprostat"><div class="npro-top"><span class="npro-badge"><i data-lucide="crown"></i> SpeechIQ Pro</span><span class="npro-live">Active</span></div><div class="npro-d">Voice Lab &amp; unlimited coaching unlocked.</div><div class="npro-renew">Renews Aug 8 · <b>Manage</b></div></div></sc-if>
</div>
<div class="nfoot"><a class="nuser" href="Profile.dc.html"><div class="nav-av">A</div><div><div class="nu-name">Alex Rivera</div><div class="nu-meta">{{ userMeta }}</div></div><span class="nchev"><i data-lucide="chevron-right"></i></span></a></div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:256,&quot;height&quot;:780},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;learn&quot;,&quot;goals&quot;,&quot;history&quot;,&quot;profile&quot;,&quot;practice&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Nav&quot;},&quot;plan&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;free&quot;,&quot;options&quot;:[&quot;free&quot;,&quot;pro&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Nav&quot;}}">
class Component extends DCLogic {
  componentDidMount(){ this.icons(); }
  componentDidUpdate(){ this.icons(); }
  icons(){ try{ window.lucide && window.lucide.createIcons(); }catch(e){} }
  renderVals(){
    const active = this.props.active ?? "home";
    const plan = this.props.plan ?? "free";
    const items = [
      { id:"home", icon:"layout-dashboard", label:"Home", href:"Dashboard.dc.html" },
      { id:"learn", icon:"book-open", label:"Learn", href:"Learning Path.dc.html" },
      { id:"goals", icon:"target", label:"Goals", href:"Goals.dc.html" },
      { id:"history", icon:"bar-chart-2", label:"History", href:"Practice History.dc.html" },
    ];
    const menu = items.map(n => ({ ...n, cls: n.id === active ? "non" : "" }));
    const isPro = plan === "pro";
    return {
      menu,
      profileCls: active === "profile" ? "non" : "",
      isPro,
      isFree: !isPro,
      userMeta: isPro ? "Level 12 · Pro" : "Level 12 · Free plan",
    };
  }
}
</script>
</body>
</html>
